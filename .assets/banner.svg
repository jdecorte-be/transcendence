<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- pong court dashed centerline -->
  <line x1="600" y1="0" x2="600" y2="280" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4" stroke-dasharray="14 14"/>

  <!-- left paddle -->
  <rect x="60" y="110" width="14" height="60" rx="4" fill="url(#accent)"/>
  <!-- right paddle -->
  <rect x="1126" y="110" width="14" height="60" rx="4" fill="url(#accent)"/>
  <!-- ball -->
  <circle cx="600" cy="140" r="8" fill="#ffffff"/>

  <!-- wordmark -->
  <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="1">
    transcendence
  </text>
  <text x="600" y="190" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9aa4c7">
    Real-time multiplayer Pong · chat · profiles · 42 &amp; GitHub OAuth
  </text>
</svg>
